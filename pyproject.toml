[project]
name = "astribot-ee34-toolkit"
version = "0.1.0"
description = "Astribot S1 HDF5-to-LeRobot EE34 conversion and URDF kinematics audit toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "PeterX" }]
keywords = ["astribot", "lerobot", "robotics", "urdf", "viser", "kinematics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "h5py>=3.10",
    "numpy>=1.26,<2",
    "pillow>=10",
    "pyarrow>=15",
    "pyyaml>=6.0.2",
    "scipy>=1.11",
]

[project.optional-dependencies]
lerobot = [
    "lerobot @ git+https://github.com/huggingface/lerobot.git@0cf864870cf29f4738d3ade893e6fd13fbd7cdb5",
    "torch>=2.2,<3",
]
visualization = [
    "imageio[ffmpeg]>=2.34",
    "matplotlib>=3.8",
    "viser>=1.0.0",
    "yourdfpy>=0.0.60",
]
all = [
    "imageio[ffmpeg]>=2.34",
    "lerobot @ git+https://github.com/huggingface/lerobot.git@0cf864870cf29f4738d3ade893e6fd13fbd7cdb5",
    "matplotlib>=3.8",
    "torch>=2.2,<3",
    "viser>=1.0.0",
    "yourdfpy>=0.0.60",
]

[project.scripts]
astribot-ee34-convert = "astribot_ee34.convert:main"
astribot-ee34-render-video = "astribot_ee34.render_video:main"
astribot-ee34-render-rollout = "astribot_ee34.render_rollout:main"
astribot-ee34-validate-contract = "astribot_ee34.validate_contract:main"
astribot-ee34-validate-dataset = "astribot_ee34.validate_dataset:main"
astribot-ee34-validate-kinematics = "astribot_ee34.validate_kinematics:main"
astribot-ee34-visualize = "astribot_ee34.visualize:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astribot_ee34"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "PERF", "RUF", "SIM", "UP", "W"]
